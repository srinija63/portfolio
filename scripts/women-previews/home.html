<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0c0c;
      font-family: Inter, system-ui, sans-serif;
    }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      overflow: hidden;
      border: 2px solid rgba(215,226,234,0.15);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      background: #f1f1f1;
      padding: 20px 16px 28px;
      color: #111;
    }
    .hero {
      height: 220px;
      border-radius: 16px;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: grid;
      place-items: center;
      font-size: 64px;
      margin-bottom: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      padding: 18px 8px;
      font-size: 18px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .btn {
      margin-top: 28px;
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      background: #6200ee;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="hero">🚗</div>
    <div class="row"><span>G-FORCE</span><strong>00.42</strong><span>g</span></div>
    <div class="row"><span>SPEED</span><strong>38.50</strong><span>kmph</span></div>
    <div class="row"><span>PRESSURE</span><strong>1012.0</strong><span>hPa</span></div>
    <div class="row"><span>SOUND</span><strong>62.10</strong><span>dB</span></div>
    <button class="btn" type="button">START TRACKING</button>
  </div>
</body>
</html>
