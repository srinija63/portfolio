<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Alarm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0c0c;
      font-family: Inter, system-ui, sans-serif;
    }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      overflow: hidden;
      border: 2px solid rgba(215,226,234,0.15);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      background: rgba(0,0,0,0.55);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 20px 18px 18px;
      text-align: center;
      color: #111;
    }
    h2 { font-size: 22px; margin-bottom: 14px; color: #b91c1c; }
    .icon { font-size: 72px; line-height: 1; margin: 8px 0; }
    .timer { font-size: 28px; font-weight: 700; margin: 8px 0; }
    .sub { font-size: 16px; color: #555; margin-bottom: 16px; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="card">
      <h2>EMERGENCY DETECTED !!</h2>
      <div class="icon">⚠️</div>
      <div class="timer">6 seconds</div>
      <div class="sub">Alerting emergency contacts...</div>
      <button class="btn" type="button">CANCEL ALARM</button>
    </div>
  </div>
</body>
</html>
