<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0c0c;
      font-family: Inter, system-ui, sans-serif;
    }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      overflow: hidden;
      border: 2px solid rgba(215,226,234,0.15);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      background: linear-gradient(160deg, #4a148c 0%, #1a237e 45%, #0d1b2a 100%);
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      color: #fff;
    }
    h1 { text-align: center; font-size: 24px; letter-spacing: 1px; margin-top: 80px; }
    .field {
      background: #000;
      border-radius: 6px;
      padding: 14px 12px;
      color: #fff;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .field.muted { color: rgba(255,255,255,0.55); }
    .btn {
      margin-top: 24px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
    }
    .link { text-align: center; color: #ffeb3b; font-size: 15px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="phone">
    <h1>USER LOGIN</h1>
    <div class="field muted">Email ID</div>
    <div class="field muted">Password</div>
    <button class="btn" type="button">LOGIN</button>
    <div class="link">Don't have account? Register here</div>
  </div>
</body>
</html>
