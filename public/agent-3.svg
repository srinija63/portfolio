<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A14"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 520) rotate(12) scale(620 520)">
      <stop stop-color="#6EA8FE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6EA8FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1220 520) rotate(-12) scale(620 520)">
      <stop stop-color="#6C5CE7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="480" cy="520" rx="620" ry="520" fill="url(#glow1)"/>
  <ellipse cx="1220" cy="520" rx="620" ry="520" fill="url(#glow2)"/>

  <text x="220" y="170" fill="#E5EEFC" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="56" font-weight="900">
    API - FastAPI endpoint
  </text>
  <text x="220" y="220" fill="#9FB0D0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="24" font-weight="500">
    GET /ask?q=...  ->  summary + comparison + sources
  </text>

  <g filter="url(#shadow)">
    <rect x="220" y="300" width="1160" height="560" rx="28" fill="rgb(14,22,46)" fill-opacity="0.88" stroke="rgb(148,163,184)" stroke-opacity="0.18" stroke-width="2"/>

    <text x="270" y="370" fill="#E5EEFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="18" font-weight="700">
      curl "http://127.0.0.1:8000/ask?q=Compare%20LangChain%20and%20LlamaIndex%20for%20RAG"
    </text>

    <rect x="270" y="410" width="1060" height="410" rx="22" fill="rgb(7,14,32)" fill-opacity="0.72" stroke="rgb(148,163,184)" stroke-opacity="0.14" stroke-width="2"/>
    <text x="310" y="470" fill="#9FB0D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="650">
      {
    </text>
    <text x="310" y="510" fill="#E5EEFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="650">
        "summary": "...",
    </text>
    <text x="310" y="550" fill="#E5EEFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="650">
        "comparison": "...",
    </text>
    <text x="310" y="590" fill="#E5EEFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="650">
        "sources": ["https://...", "https://..."]
    </text>
    <text x="310" y="630" fill="#9FB0D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="650">
      }
    </text>

    <rect x="1050" y="450" width="250" height="52" rx="14" fill="rgb(110,168,254)" fill-opacity="0.14" stroke="rgb(110,168,254)" stroke-opacity="0.24"/>
    <text x="1090" y="483" fill="#C6DBFF" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16" font-weight="800" letter-spacing="1">
      /docs available
    </text>
  </g>
</svg>
