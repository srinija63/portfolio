<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0C0C"/>
      <stop offset="1" stop-color="#0A0A10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 420) rotate(90) scale(720 860)">
      <stop stop-color="#F43F5E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="820" cy="420" rx="860" ry="720" fill="url(#glow)"/>

  <text x="220" y="170" fill="#D7E2EA" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="58" font-weight="900">
    Alert countdown
  </text>
  <text x="220" y="220" fill="#D7E2EA" fill-opacity="0.65" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="24" font-weight="600">
    Cancel before the alert is sent to contacts
  </text>

  <g filter="url(#shadow)">
    <!-- modal -->
    <rect x="500" y="290" width="600" height="540" rx="36" fill="rgb(20,20,24)" fill-opacity="0.94" stroke="rgb(215,226,234)" stroke-opacity="0.10" stroke-width="2"/>

    <text x="580" y="380" fill="#D7E2EA" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="26" font-weight="900">
      EMERGENCY DETECTED !!
    </text>

    <rect x="610" y="420" width="380" height="150" rx="24" fill="rgb(244,63,94)" fill-opacity="0.10" stroke="rgb(244,63,94)" stroke-opacity="0.22" stroke-width="2"/>
    <text x="725" y="502" fill="rgb(244,63,94)" fill-opacity="0.6" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16" font-weight="800">
      siren + vibration
    </text>

    <text x="720" y="650" fill="#D7E2EA" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="44" font-weight="900">
      06
    </text>
    <text x="792" y="650" fill="#D7E2EA" fill-opacity="0.75" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="20" font-weight="800">
      seconds
    </text>
    <text x="740" y="684" fill="#D7E2EA" fill-opacity="0.55" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16" font-weight="700">
      left
    </text>

    <rect x="630" y="720" width="340" height="58" rx="18" fill="rgb(244,63,94)" fill-opacity="0.92"/>
    <text x="700" y="758" fill="#FFFFFF" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16" font-weight="900" letter-spacing="2">
      CANCEL ALARM
    </text>
  </g>
</svg>

