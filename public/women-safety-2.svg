<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0C0C"/>
      <stop offset="1" stop-color="#0A0A10"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 360) rotate(15) scale(720 560)">
      <stop stop-color="#60A5FA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="420" cy="360" rx="720" ry="560" fill="url(#glow1)"/>

  <text x="220" y="170" fill="#D7E2EA" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="58" font-weight="900">
    Location share + contacts
  </text>
  <text x="220" y="220" fill="#D7E2EA" fill-opacity="0.65" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="24" font-weight="600">
    Send live location to trusted contacts instantly
  </text>

  <g filter="url(#shadow)">
    <!-- map card -->
    <rect x="220" y="280" width="820" height="620" rx="48" fill="rgb(20,20,24)" fill-opacity="0.94" stroke="rgb(215,226,234)" stroke-opacity="0.10" stroke-width="2"/>
    <rect x="260" y="330" width="740" height="420" rx="34" fill="rgb(96,165,250)" fill-opacity="0.10" stroke="rgb(96,165,250)" stroke-opacity="0.22" stroke-width="2"/>
    <!-- map lines -->
    <path d="M300 420H960" stroke="rgb(215,226,234)" stroke-opacity="0.12" stroke-width="3"/>
    <path d="M360 360V720" stroke="rgb(215,226,234)" stroke-opacity="0.10" stroke-width="3"/>
    <path d="M520 360V720" stroke="rgb(215,226,234)" stroke-opacity="0.10" stroke-width="3"/>
    <path d="M680 360V720" stroke="rgb(215,226,234)" stroke-opacity="0.10" stroke-width="3"/>
    <path d="M840 360V720" stroke="rgb(215,226,234)" stroke-opacity="0.10" stroke-width="3"/>
    <!-- marker -->
    <circle cx="720" cy="560" r="46" fill="rgb(244,63,94)" fill-opacity="0.22"/>
    <path d="M720 496c-42 0-76 34-76 76 0 60 76 140 76 140s76-80 76-140c0-42-34-76-76-76Z" fill="rgb(244,63,94)" fill-opacity="0.92"/>
    <circle cx="720" cy="572" r="18" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- contacts list -->
    <rect x="260" y="770" width="740" height="100" rx="28" fill="rgb(215,226,234)" fill-opacity="0.05" stroke="rgb(215,226,234)" stroke-opacity="0.10"/>
    <text x="300" y="820" fill="#D7E2EA" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16" font-weight="800">
      Contacts
    </text>
    <text x="300" y="852" fill="#D7E2EA" fill-opacity="0.65" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="14" font-weight="650">
      Mom " Friend " Roommate
    </text>

    <!-- action -->
    <rect x="1080" y="360" width="300" height="56" rx="18" fill="rgb(244,63,94)" fill-opacity="0.92"/>
    <text x="1135" y="397" fill="#FFFFFF" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16" font-weight="900" letter-spacing="2">
      SHARE NOW
    </text>
    <rect x="1080" y="430" width="300" height="56" rx="18" fill="rgb(215,226,234)" fill-opacity="0.06" stroke="rgb(215,226,234)" stroke-opacity="0.10"/>
    <text x="1130" y="467" fill="#D7E2EA" fill-opacity="0.8" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="14" font-weight="800" letter-spacing="2">
      CALL HELPLINE
    </text>
  </g>
</svg>

